<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TrustVault - 24 second showreel</title>
<style>
/*FONTS*/
* { box-sizing: border-box; margin: 0; }
html, body { background: #000; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
canvas { display: block; }
/* make sure every face is requested so the canvas can use it */
.preload { position: absolute; opacity: 0; pointer-events: none; }
#ui { position: fixed; left: 0; right: 0; bottom: 0; height: 50px; display: flex; gap: 12px; align-items: center; padding: 0 14px; background: #111; color: #ccc; font: 13px monospace; }
#ui input { flex: 1; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<span class="preload" style="font: 900 20px 'Inter Tight'">a</span><span class="preload" style="font: 500 20px 'JetBrains Mono'">a</span><span class="preload" style="font: 600 20px Inter">a</span>
<div id="ui"><button id="playBtn">Play</button><input id="scrub" type="range" min="0" max="24" step="0.01" value="0"><span id="clock">0.00</span></div>

<script type="module">
// The showreel itself lives in client/src/lib/showreel.js (the website plays it live); this page films it for the MP4.
import { createShowreel } from '../../client/src/lib/showreel.js';
const reel = createShowreel(document.getElementById('c'));
const VIDEO = { w: 1920, h: 1080, duration: reel.duration };
window.VIDEO = VIDEO;
window.seek = reel.seek;
window.buildAudio = reel.buildAudio;
// ---------- preview (no ?render) ----------
const RENDER = location.search.includes('render');
if (RENDER) { document.getElementById('ui').remove(); }
else {
  const fit = () => { const k = Math.min(innerWidth / 1920, (innerHeight - 50) / 1080); document.getElementById('stage').style.transform = `scale(${k})`; };
  addEventListener('resize', fit); fit();
  let buf, ac, src, startAt = 0, offset = 0, playing = false;
  async function play() {
    ac ??= new AudioContext();
    if (!buf) { const off = new OfflineAudioContext(2, Math.ceil(48000 * VIDEO.duration), 48000); await reel.buildAudio(off); buf = await off.startRendering(); }
    src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination);
    src.start(0, offset % VIDEO.duration); startAt = ac.currentTime; playing = true; document.getElementById('playBtn').textContent = 'Pause';
  }
  function pause() { if (!playing) return; offset += ac.currentTime - startAt; src.stop(); playing = false; document.getElementById('playBtn').textContent = 'Play'; }
  const now = () => (playing ? (offset + ac.currentTime - startAt) % VIDEO.duration : offset);
  document.getElementById('playBtn').onclick = () => (playing ? pause() : play());
  document.getElementById('scrub').oninput = (e) => { const was = playing; pause(); offset = +e.target.value; if (was) play(); };
  (function loop() { const t = now(); reel.seek(t); document.getElementById('scrub').value = t; document.getElementById('clock').textContent = t.toFixed(2); requestAnimationFrame(loop); })();
}

reel.seek(0);
</script>
</body>
</html>
